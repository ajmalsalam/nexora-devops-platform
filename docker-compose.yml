services:

  backend:
    build:
      context: ./backend
    container_name: nexora-backend
    restart: unless-stopped
    volumes:
      - ./backend/data.db:/app/data.db
    expose:
      - "5000"
    networks:
      - nexora

  frontend:
    build:
      context: ./frontend
    container_name: nexora-frontend
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - nexora

  nginx:
    image: nginx:alpine
    container_name: nexora-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - nexora

networks:
  nexora:
    driver: bridge
