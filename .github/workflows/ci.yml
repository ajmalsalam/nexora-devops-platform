name: Nexora CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Validate Flask application
        working-directory: backend
        run: python -c "import application; print('Backend import successful')"

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker:
    name: Docker validation
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose config

      - name: Build Docker images
        run: docker compose build

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
      - docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy application to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

          ssh "$EC2_USER@$EC2_HOST" << 'EOF'
            set -e

            cd ~/nexora-devops-platform

            git switch main
            git pull origin main

            docker compose up -d --build

            docker compose ps
           
            echo "Waiting for backend API..."

            for i in {1..30}; do
              if curl -fsS http://127.0.0.1/api/v1/users > /dev/null; then
                echo "Backend API is ready"
                break
              fi

              if [ "$i" -eq 30 ]; then
                echo "Backend API failed to become ready"
                docker compose ps
                docker compose logs --tail 50 backend
                exit 1
              fi

              echo "Backend not ready yet... attempt $i/30"
              sleep 2
            done

            echo "Testing frontend..."
            curl -fsS http://127.0.0.1/ > /dev/null

            echo "Testing API..."
            curl -fsS http://127.0.0.1/api/v1/users

            echo "Deployment successful"
          EOF
